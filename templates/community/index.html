{% extends 'blank.html' %}
{% load i18n %}


{% block title %}Facility{% endblock %}

{% block content %}
<div class="container">
    <h1>Welcome, {{ username }}!</h1>
    <p>This dynamic content is successfully loaded from a template view.</p>
    <p>Русский текст</p>
    <button class="btn" id="player">🔊</button>
</div>
<script>
    const player = document.getElementById("player");
    player.addEventListener("click", () => {
        const aud = new Audio("https://www.myinstants.com/media/sounds/golosovanie-ks.mp3");
        aud.play();
    });
</script>
{% endblock %}
