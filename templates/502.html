<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        HANGAR 13 // 502
    </title>
    
    <!-- Import Minecraft-like font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        :root {
            --rust-dark: #5e3a26;
            --rust-light: #8c5a3c;
            --metal-grey: #7d8b8f;
            --metal-shadow: #3e4648;
            --neon-green: #39ff14; /* Terminal text */
            --neon-yellow: #fff700; /* Terminal text */
            --amber: #ffb000;      /* Warning lights */
            --bg-color: #2b2b2b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P'; 
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: none;
            font-smooth: never;
            background-color: var(--bg-color);
            color: #ddd;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- TEXTURES --- */
        
        /* The Brick Wall Background (CSS Pattern) */
        .hangar-wall {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background-color: #4a3b32;
            background-image: 
                linear-gradient(335deg, rgba(0,0,0,0.3) 23px, transparent 23px),
                linear-gradient(155deg, rgba(0,0,0,0.3) 23px, transparent 23px),
                linear-gradient(335deg, rgba(0,0,0,0.3) 23px, transparent 23px),
                linear-gradient(155deg, rgba(0,0,0,0.3) 23px, transparent 23px);
            background-size: 58px 58px;
            background-position: 0px 2px, 4px 35px, 29px 31px, 34px 6px;
            box-shadow: inset 0 0 150px #000;
        }

        /* The Rusty Metal Overlay */
        .rust-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.6;
            background: radial-gradient(circle at center, transparent 0%, #1a1a1a 90%);
            pointer-events: none;
        }

        /* --- LAYOUT & COMPONENTS --- */
        .upper {
            margin: 40px auto;
            border: 4px solid var(--metal-grey);
            background-color: rgba(30, 30, 30, 0.85);
            padding: 2rem;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            box-shadow: 
                0 0 0 4px #111,
                0 0 20px rgba(0,0,0,0.8),
                inset 0 0 50px rgba(0,0,0,0.5);
            /* Corner Bolts */
            background-image: 
                radial-gradient(#555 15%, transparent 16%),
                radial-gradient(#555 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, top right, bottom left, bottom right;
            background-repeat: no-repeat;
        }
        .container {
            width: 50%;
            {% comment %} max-width: 800px; {% endcomment %}
            margin: 40px auto;
            border: 4px solid var(--metal-grey);
            background-color: rgba(30, 30, 30, 0.85);
            padding: 2rem;
            position: relative;
            box-shadow: 
                0 0 0 4px #111,
                0 0 20px rgba(0,0,0,0.8),
                inset 0 0 50px rgba(0,0,0,0.5);
            /* Corner Bolts */
            background-image: 
                radial-gradient(#555 15%, transparent 16%),
                radial-gradient(#555 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, top right, bottom left, bottom right;
            background-repeat: no-repeat;
        }

        .error-container {
            width: 50%;
            margin: 40px auto;
            border: 4px solid var(--metal-grey);
            background-color: rgba(30, 30, 30, 0.85);
            padding: 2rem;
            position: relative;
            box-shadow: 
                0 0 0 4px #111,
                0 0 20px rgba(0,0,0,0.8),
                inset 0 0 50px rgba(0,0,0,0.5);
            /* Corner Bolts */
            background-image: 
                radial-gradient(#555 15%, transparent 16%),
                radial-gradient(#555 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, top right, bottom left, bottom right;
            background-repeat: no-repeat;
        }

        .logo {
            text-align: left;
            color: var(--amber);
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-top: 0;
            text-shadow: 2px 2px 0px #000;
            animation: flicker-text 4s infinite;
        }
        h1 {
            text-align: center;
            color: var(--amber);
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-top: 0;
            text-shadow: 2px 2px 0px #000;
            animation: flicker-text 4s infinite;
        }

        p {
            line-height: 1.6;
            font-size: 1.1rem;
            color: #ccc;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(to bottom, #5e5e5e, #333);
            border: 2px solid #111;
            color: #fff;
            padding: 10px 20px;
            text-decoration: none;
            font-family: 'Press Start 2P'; 
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
            transition: transform 0.1s;
        }

        .btn:hover {
            background: linear-gradient(to bottom, #777, #444);
            color: var(--neon-green);
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }

        /* --- MALFUNCTION EFFECTS --- */

        /* The Flickering Light Overlay */
        .light-flicker {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            background: rgba(255, 255, 255, 0.05);
            animation: light-buzz 0.1s infinite;
            mix-blend-mode: overlay;
        }

        /* Scanlines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 99;
        }

        /* --- ANIMATIONS --- */

        @keyframes light-buzz {
            0% { opacity: 0.8; }
            50% { opacity: 0.9; }
            51% { opacity: 0.2; } /* The glitch */
            52% { opacity: 0.8; }
            100% { opacity: 0.85; }
        }

        @keyframes flicker-text {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                text-shadow: 
                    2px 2px 0px #000,
                    0 0 10px var(--amber);
                opacity: 1;
            }
            20%, 24%, 55% {
                text-shadow: none;
                opacity: 0.4;
            }
        }

        /* --- PARTICLES (Dust/Water) --- */
        .particle {
            position: absolute;
            background-color: rgba(200, 200, 200, 0.5);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }
        
        .drip {
            width: 2px !important;
            height: 10px !important;
            background-color: rgba(100, 200, 255, 0.6) !important;
        }



    </style>
    {% block head %}
        
    {% endblock %}
    <div class="upper">
        <h2 class="logo">ангар-13</h2>
        <ul style="display: flex; list-style-type: none; gap: 15px; padding: 0; font-family: 'Press Start 2P'; ">
            <li><button class="btn">error</button></li>
            <li><button class="btn">error</button></li>
            <li><button class="btn">error</button></li>
        </ul>
    </div>
</head>
<body>

    <!-- Visual Layers -->
    <div class="hangar-wall"></div>
    <div class="rust-overlay"></div>
    <div class="light-flicker"></div>
    <div class="scanlines"></div>

    <!-- Main Content Area -->
    {% block content %}
    <div class="error-container">
        
        <!-- Django Template Block -->
        <p>SYSTEM STATUS: CRITICAL</p>
        <p>Facility unavailable.</p>
        <p>Error code: 502</p>
        <br>
        <a href="community" class="btn">Enter Facility</a>

    </div>
    {% endblock %}

    <!-- Script for Dust and Dripping Water -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // Create Dust Particles
            function createDust() {
                const dust = document.createElement('div');
                dust.classList.add('particle');
                
                // Random size
                const size = Math.random() * 4 + 1;
                dust.style.width = `${size}px`;
                dust.style.height = `${size}px`;
                
                // Random position
                dust.style.left = `${Math.random() * 100}vw`;
                dust.style.top = `${Math.random() * 100}vh`;
                
                // Animation duration
                const duration = Math.random() * 5 + 5;
                dust.style.transition = `all ${duration}s linear`;
                
                document.body.appendChild(dust);

                // Trigger animation
                setTimeout(() => {
                    dust.style.transform = `translate(${Math.random() * 100 - 50}px, 20px)`;
                    dust.style.opacity = 0;
                }, 100);

                // Cleanup
                setTimeout(() => {
                    dust.remove();
                }, duration * 1000);
            }

            // Create Dripping Water (occasional)
            function createDrip() {
                const drip = document.createElement('div');
                drip.classList.add('particle', 'drip');
                
                drip.style.left = `${Math.random() * 100}vw`;
                drip.style.top = '-20px';
                
                document.body.appendChild(drip);

                setTimeout(() => {
                    drip.style.top = `${window.innerHeight}px`;
                    drip.style.opacity = 0;
                }, 50);

                setTimeout(() => {
                    drip.remove();
                }, 3000);
            }

            // Intervals
            setInterval(createDust, 200); // Lots of dust
            setInterval(createDrip, 800); // Occasional leak
        });
    </script>
</body>
</html>
